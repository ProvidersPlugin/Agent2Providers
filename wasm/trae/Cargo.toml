[package]
name = "agent2api-wasm-trae"
version = "0.1.0-beta.2"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
agent2api-wasm-sdk = { path = "../sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "alloc"] }
url = "2"
