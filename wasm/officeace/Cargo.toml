[package]
name = "agent2api-wasm-officeace"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
agent2api-wasm-sdk = { path = "../sdk" }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2"
