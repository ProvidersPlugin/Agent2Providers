<!doctype html>
<html lang="zh-Hans" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>签到中心</title>
<!--
  插件包里的签到中心页面。

  ── 为什么这一页在插件包里 ──────────────────────────────────
  签到能力全部来自提供商插件（自定义 API 提供商结构上不可能有签到：网关的
  `supports_checkin` 对 `custom-*` 一律返回 false）。既然「有没有这一页」取决于
  装了什么插件，页面本身就该由插件提供 —— 否则每加一家、每改一条链路，每个
  客户端都要跟着改一遍。

  ── 数据从哪来 ──────────────────────────────────────────────
  页面只调网关的 `/api/*`（聚合快照、定时条目、记录台账）。**编排留在网关**：
  一条定时条目可能横跨九家，卸载插件不能让用户丢排程；这些事实与「装了什么
  插件」无关，所以它们在网关侧，页面只是它的一份视图。

  ── 样式与组件从哪来 ────────────────────────────────────────
  三份资源都由网关出（`/plugins/runtime/*`，见网关 `api::plugin_theme`）：

    · `runtime/theme.css`     宿主的设计令牌原文（色板 / 圆角 / 阴影 / 滚动条）
    · `runtime/islands/ui.css` 组件库样式（Tailwind 产物，不含 preflight）
    · `runtime/islands/ui.js`  组件库 + React，挂到 `window.wbUiKit`

  iframe 是独立文档，这三样都读不到宿主的 —— 由网关把**同一份**出过来，
  于是这一页的按钮、徽章、开关与宿主逐字相同（它们就是同一个组件），
  色板与圆角也自动跟随网关版本。

  加载顺序：两份 CSS 在 head（先令牌后组件，组件里的 var() 才解析得到）；
  `ui.js` 用普通 script 同步加载，必须早于 `main.js`（后者是 module，
  defer 执行 —— 普通脚本天然先跑完）。

  ── 主题怎么定 ──────────────────────────────────────────────
  宿主的主题选择在 localStorage 里（iframe 读不到），所以由宿主通过
  postMessage 告知，页面写到自己的 `<html data-theme>` 上（见 main.js）。
  拿不到时保持 `system`：WebView2 的 `prefers-color-scheme` 跟着窗口主题走，
  与宿主 `applyTheme` 交回系统的那条路径一致。
-->
<link rel="stylesheet" href="/plugins/runtime/theme.css">
<link rel="stylesheet" href="/plugins/runtime/layout.css">
<link rel="stylesheet" href="/plugins/runtime/components.css">
<link rel="stylesheet" href="/plugins/runtime/tooltip.css">
<link rel="stylesheet" href="/plugins/runtime/islands/ui.css">
<link rel="stylesheet" href="page.css">
<script src="/plugins/runtime/islands/ui.js"></script>
</head>
<body>
<div class="ck-shell">
  <div class="ck-inner">
    <!-- Tab 条：三个档位由 main.js 用组件库的 SegmentedControl 渲染进 #tabs-host，
         右侧徽标与「刷新」也由它渲染（它们同样是组件库的 Badge / Button）。
         结构留在 HTML 里只是为了先占位，避免首帧闪一下空白。 -->
    <div class="ck-tabs">
      <span id="tabs-host"></span>
      <span class="ck-tab-spacer"></span>
      <span id="auto-badge"></span>
      <span id="reload-host"></span>
    </div>
    <div class="ck-error" id="page-error" hidden></div>
    <div class="ck-body" id="tab-center"></div>
    <div class="ck-body" id="tab-schedule" hidden></div>
    <div class="ck-body" id="tab-records" hidden></div>
  </div>
</div>
<div class="ck-toast" id="toast" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
